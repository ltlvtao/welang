owner = "1800-concurrency"
requirement = "The Shareable marker"
allocated = "2026-09-04"

[diagnostic.E1607]
severity = "error"
title = "task handle reaches scope exit un-awaited, or await and cancel both fire"
description = "A TaskHandle binding created in a scope body violates the handle discipline: on some control-flow path it reaches the body's end with neither await nor cancel, or one handle takes a second await or a cancel after an await. Each handle is one-shot and must be discharged exactly once on every path - the same single-trigger path analysis release obligations use."
remediation = "Await or cancel the handle on every path from its creation; on early exits the scope's own exit discharge covers it - plain and timeout forms cancel the rest, collectAll joins them."
owner = "1800-concurrency"
requirement = "Scope blocks"
allocated = "2026-09-04"

[diagnostic.E1608]
severity = "error"
title = "currentCancelSignal called outside a task block"
description = "The cancellation accessor is called outside any task block's body - a plain function, a module initializer, or any other position. A signal belongs to one task; outside its body there is no current task and no default signal, and the check is static."
