[diagnostic.E1611]
severity = "error"
title = "select case pattern is not a binding or the wildcard"
description = "A select case carries a pattern beyond a bare binding name or the wildcard _ - a variant pattern, a literal, an or-pattern. The case binds what the source yields, all of it; a no-match policy exists for no rule here."
