# We diagnostic code registry — the single registry of the diagnostic
# code system (spec chapter 99: 9900-diagnostics-registry.md).
#
# Authority: this file is the entry authority for every allocated
# diagnostic code and the segment authority for code ranges. Chapters
# define when codes fire (trigger authority, in Requirements and
# Scenarios); this file defines each code's complete entry.
#
# Machine artifact: English only, no paired translation. Extension
# only via spec-layer changes in the same change that ratifies the
# codes. Renumbering, deleting, or re-meaning allocated codes is
# forbidden. Adding entry fields is backward-compatible; removing or
# renaming fields is not.

[segments."E0001-E0099"]
domain = "lexical and naming"
owner = "0100-lexical"
# Intra-segment structure (chapter 1): E0001-E0009 token-level
# errors, E0010 boundary reserve, E0011-E0019 naming block
# (E0011-E0013 allocated), E0014-E0099 reserved for amendments.

[segments."E0100-E0199"]
domain = "grammar and parsing"
owner = "0200-grammar"
# Intra-segment structure (chapter 2): E0100 boundary reserve,
# E0101-E0105 parse-level errors (ambiguity, line-joining, statement
# forms, precedence), E0106-E0199 reserved for later grammar
# productions (control flow, declarations, collections).

[segments."E0200-E0299"]
domain = "control flow"
owner = "0300-control-flow"
# Intra-segment structure (chapter 3): E0200 boundary reserve,
# E0201-E0204 control-flow form errors (loop control, value
# position, defer), E0205-E0299 reserved for later control-flow
# productions (for, labels if ever ratified). Match owns E03xx.

[segments."E0300-E0399"]
domain = "match and patterns"
owner = "0400-match"
# Intra-segment structure (chapter 4): E0300 boundary reserve,
# E0301-E0302 match form errors (arm count, or-pattern bindings),
# E0303-E0307 typing-level match checks (variant pattern resolution,
# payload arity, exhaustiveness, guard fallback, unreachable arms)
# entered via the sum-types chapter's paired amendment, E0308-E0399
# reserved for later amendments.

[segments."E0400-E0499"]
domain = "declarations and modules"
owner = "0600-declarations"
# Intra-segment structure (chapter 6): E0400 boundary reserve,
# E0401-E0405 declaration-form errors (return placement, value
# return in a valueless function, top-level var, duplicate names,
# orphan documentation comments), E0406-E0499 reserved for
# amendments of the declarations chapter.

[segments."E0500-E0599"]
domain = "types"
owner = "0700-types"
# Intra-segment structure (chapter 7): E0500 boundary reserve,
# E0501-E0503 type-agreement errors (mixed types across operands
# and agreement positions, integer overflow, non-Bool conditions),
# E0504-E0599 reserved for amendments of the types chapter.

[segments."E0600-E0699"]
domain = "composite types and ownership"
owner = "0800-composites"
# Intra-segment structure (chapter 8): E0600 boundary reserve,
# E0601-E0606 composite-form errors (value-category field, tuple
# arity, non-record construction/update head or base, field-set
# mismatch, dropped non-unit value, resource update), E0607-E0699
# reserved for amendments of the composites chapter.

[segments."E0700-E0799"]
domain = "sum types and the bottom type"
owner = "0900-sum-types"
# Intra-segment structure (chapter 9): E0700 boundary reserve,
# E0701-E0704 sum-declaration errors (payload arity, value-sum
# payload category, Never position, bare payloaded constructor),
# E0705-E0799 reserved for amendments of the sum-types chapter.

[segments."E0800-E0899"]
domain = "interfaces and generics"
owner = "1000-interfaces"
# Intra-segment structure (chapter 10): E0800 boundary reserve,
# E0801-E0831 interface/impl/receiver/member-resolution errors
# (receivers, associated types, impl completeness/uniqueness/
# locality, receiver field assignment, member resolution), Dyn
# and derive errors, generic declaration/reference/inference and
# where-clause errors. E0826's rule binds the method-clause nesting
# surface ratified with chapter 17. E0832-E0899 reserved for
# amendments (Shareable, codecs).

[segments."E0900-E0999"]
domain = "iterable protocols"
owner = "1100-iterables"
# Intra-segment structure (chapter 11): E0900 boundary reserve,
# E0901-E0904 for-legality / range-operand / resource-impl /
# Iter-binding errors. E0905-E0999 reserved for later
# iterable-protocol amendments.

[segments."E1000-E1099"]
domain = "function types and closures"
owner = "1200-fn-types"
# Intra-segment structure (chapter 12): E1000 boundary reserve,
# E1001-E1004 bare-closure-expectation / resource-capture /
# captured-value-assignment / generic-fn-name errors.
# E1005-E1099 reserved for later fn-type amendments.

[segments."E1100-E1199"]
domain = "resources"
owner = "1300-resources"
# Intra-segment structure (chapter 13): E1100 boundary reserve,
# E1101-E1106 release-contract / scope-head / discipline /
# rebinding / composite-position errors.
# E1107-E1199 reserved for amendments (panic binding, position
# refinement of generic arguments).

[segments."E1200-E1299"]
domain = "errors"
owner = "1400-errors"
# Intra-segment structure (chapter 14): E1200 boundary reserve,
# E1201-E1204 propagation-operand / context / error-type-agreement /
# error-position errors.
# E1205-E1299 reserved for amendments (combinator-era codes, panic
# message-shape codes).

[segments."E1300-E1399"]
domain = "modules"
owner = "1500-modules"
# Intra-segment structure (chapter 15): E1300 boundary reserve,
# E1301-E1305 circular-dependency / not-found / module-local-use /
# unresolved-name / main-signature errors.
# E1306-E1399 reserved for amendments (dependency-era codes,
# visibility-level refinements).

[segments."E1400-E1499"]
domain = "effects"
owner = "1600-effects"
# Intra-segment structure (chapter 16): E1400 boundary reserve,
# E1401-E1405 undeclared-call / value-vs-type mismatch / builtin-name
# conflict / impl-vs-interface disagreement / initializer impurity.
# E1406-E1499 reserved for amendments (the testing codes landed in
# chapter 20's E18xx segment; the FFI codes landed in chapter 19's E17xx
# segment; the toolchain codes landed in chapter 21's E19xx segment; the
# dependency codes landed in chapter 22's E20xx segment).

[segments."E1500-E1599"]
domain = "collections"
owner = "1700-collections"
# Intra-segment structure (chapter 17): E1500 boundary reserve,
# E1501 empty-list-literal expectation error, E1502-E1599 reserved
# for amendments of the collections chapter.

[segments."E1600-E1699"]
domain = "concurrency"
owner = "1800-concurrency"
# Intra-segment structure (chapter 18): E1600 boundary reserve,
# E1601-E1618 task blocks, task capture discipline, scope handle
# discipline, select, shared-state types, channels; E1619-E1699
# reserved for amendments (the transaction family among them).

[segments."E1700-E1799"]
domain = "ffi"
owner = "1900-ffi"
# Intra-segment structure (chapter 19): E1700 boundary reserve,
# E1701-E1707 foreign block / declaration / opaque-type / crossing-set
# diagnostics; E1708-E1799 reserved for amendments (the callback family
# among them, when its registered questions are answered).

[segments."E1800-E1899"]
domain = "testing"
owner = "2000-testing"
# Intra-segment structure (chapter 20): E1800 boundary reserve,
# E1801-E1806 test-module / mock-declaration / advanceTime-position
# diagnostics; E1807-E1899 reserved for amendments.

[segments."E1900-E1999"]
domain = "toolchain"
owner = "2100-toolchain"
# Intra-segment structure (chapter 21): E1901-E1907 command-surface /
# pipeline / manifest / linkage / exploration errors; W1910-W1912 the
# three named advisories (E and W share the number space, chapter 99,
# numbers 1910-1912 being the warnings' own); numbers 1900, 1908-1909,
# and 1913-1999 reserved for amendments.

[segments."E2000-E2099"]
domain = "dependencies"
owner = "2200-dependencies"
# Intra-segment structure (chapter 22): E2001-E2006 are all errors -
# declaration checks, constraint grammar, resolution failures, lock
# integrity; no W code is allocated in this segment (every finding
# stops the run); numbers 2000 and 2007-2099 reserved for amendments,
# letterless per the shared-space rule.

[segments."E2100-E9999"]
domain = "later domains"
owner = "unclaimed" # claimed by chapters via amendment

[diagnostic.E0001]
severity = "error"
title = "invalid character"
description = "A byte sequence is not valid UTF-8, or a character appears where only a token may form and matches nothing in the lexical inventory (for example $, @, a backtick, a bare # not followed by [), or a non-ASCII character is used in an identifier. Identifiers are ASCII-only by design: homoglyph confusability is a security surface, not a style matter. Fires under: Source files, Identifiers, Operators and punctuation."
remediation = "Replace the offending character: use an ASCII letter/digit/underscore in identifiers, an operator or punctuation from the closed inventory, or move the non-ASCII text into a comment or literal."
owner = "0100-lexical"
requirement = "Source files"
allocated = "2026-09-03"

[diagnostic.E0002]
severity = "error"
title = "unterminated string literal"
description = "A string literal is not closed with a closing double quote before the end of the line. String literals are single-line in We; a newline inside the literal is not part of it."
remediation = "Close the literal with \" on the same line, or split the text into adjacent literals; multiline strings do not exist at this chapter."
owner = "0100-lexical"
requirement = "String and rune literals"
allocated = "2026-09-03"

[diagnostic.E0003]
severity = "error"
title = "unterminated rune literal"
description = "A rune literal is not closed with a closing single quote on the same line. A rune literal holds exactly one character or one escape."
remediation = "Close the literal with ' on the same line and ensure it holds exactly one character or one escape sequence."
owner = "0100-lexical"
requirement = "String and rune literals"
allocated = "2026-09-03"

[diagnostic.E0004]
severity = "error"
title = "unterminated block comment"
description = "A /* block comment is not closed by */ before end of file. Block comments do not nest: the first */ closes the comment."
remediation = "Add the closing */ or remove the /*; to comment out a region that itself contains block comments, comment it line by line with //."
owner = "0100-lexical"
requirement = "Comments"
allocated = "2026-09-03"

[diagnostic.E0005]
severity = "error"
title = "invalid escape sequence"
description = "A backslash inside a string or rune literal is followed by a character outside the closed escape set. Permitted: \\n \\t \\r \\0 \\\" \\' \\u{h..} (1-6 hex digits, value <= U+10FFFF, surrogates forbidden)."
remediation = "Use an escape from the closed set; for arbitrary code points use \\u{...}; to write a literal backslash use \\\\."
owner = "0100-lexical"
requirement = "String and rune literals"
allocated = "2026-09-03"

[diagnostic.E0006]
severity = "error"
title = "invalid numeric literal"
description = "A numeric literal matches no ratified form: a base prefix (0x/0o/0b) without at least one digit of that base; an underscore separator that is not between two digits (leading, trailing, doubled, adjacent to prefix or suffix); a decimal literal with a leading zero; a float without a digit on each side of the dot; or an unknown suffix. Suffixes are a closed set: i8 i16 i32 i64 u8 u16 u32 u64 f32 f64."
remediation = "Check: (1) 0x/0o/0b is followed by at least one digit of that base; (2) _ appears only between two digits; (3) decimal literals have no leading zero; (4) the suffix is one of i8..u64, f32, f64 written immediately after the last digit."
owner = "0100-lexical"
requirement = "Numeric literals"
allocated = "2026-09-03"

[diagnostic.E0007]
severity = "error"
title = "unbalanced interpolation braces"
description = "Inside a string literal, ${ opens an interpolation hole whose braces are not balanced within the literal. A $ not followed by { is an ordinary character and never starts interpolation."
remediation = "Balance the braces inside the ${...} hole, escaping literal braces if needed is not available — restructure the expression or build the string in parts; verify the hole contains a complete expression."
owner = "0100-lexical"
requirement = "String and rune literals"
allocated = "2026-09-03"

[diagnostic.E0008]
severity = "error"
title = "unknown attribute"
description = "An attribute names a word not in the closed whitelist assembled from ratified chapters. Unknown attributes are compile errors, never silently ignored."
remediation = "Remove the attribute or check its spelling against the whitelist of attributes ratified by the owning chapters; attribute names join the whitelist only through spec-layer changes."
owner = "0100-lexical"
requirement = "Attribute lexical unit"
allocated = "2026-09-03"

[diagnostic.E0009]
severity = "error"
title = "non-literal attribute argument"
description = "An attribute argument is an expression, function call, or reference instead of a compile-time literal value (string, number, boolean, literal list). Attribute legality must stay locally decidable."
remediation = "Replace the argument with a compile-time literal; compute dynamic configuration in ordinary code, not in attributes."
owner = "0100-lexical"
requirement = "Attribute lexical unit"
allocated = "2026-09-03"

[diagnostic.E0011]
severity = "error"
title = "type name must be PascalCase"
description = "A type-name binding is not PascalCase. Sum type names and variant names follow this rule (chapter 9), and the rule is what makes a bare PascalCase pattern always a variant reference, never a binding. Naming conventions are errors, not style hints, so every We codebase reads with one convention."
remediation = "Rename the type to PascalCase (for example UserRecord) and update references; conventions are enforced at the declaration."
owner = "0100-lexical"
requirement = "Naming conventions"
allocated = "2026-09-03"

[diagnostic.E0012]
severity = "error"
title = "variable, function, and method names must be camelCase"
description = "A variable, function, or method binding is not camelCase (for example User_Id); record field names follow the variable rule (chapter 8). Constants follow the variable rule; SCREAMING_CASE does not exist in We."
remediation = "Rename the binding to camelCase (for example userId) and update references; constants also use camelCase."
owner = "0100-lexical"
requirement = "Naming conventions"
allocated = "2026-09-03"

[diagnostic.E0013]
severity = "error"
title = "module names must be lowercase"
description = "A module name is not lowercase with dot separation. Module spelling is fixed by the naming conventions and checked at the declaration."
remediation = "Rename the module to lowercase with dot separation (for example net.http.client) and update imports."
owner = "0100-lexical"
requirement = "Naming conventions"
allocated = "2026-09-03"

[diagnostic.E0101]
severity = "error"
title = "parse ambiguity"
description = "A token sequence admits two defensible parses under the ratified productions. The compiler rejects the sequence instead of choosing one interpretation and names the competing interpretations in the message (chapter 0, Principle 4). Fires under: Parse model and ambiguity rejection."
remediation = "Rewrite the construct with explicit parentheses to force a single grouping, or split it across lines so an inferred statement boundary separates the two intended items; consult the precedence and associativity table for the intended grouping."
owner = "0200-grammar"
requirement = "Parse model and ambiguity rejection"
allocated = "2026-09-03"

[diagnostic.E0102]
severity = "error"
title = "statement begins with a continuation token"
description = "At bracket depth zero a statement begins with a token that cannot begin a statement, for example a leading . before a member access or a binary-only operator. The previous line almost certainly ended a complete statement; only a trailing continuation token (binary operator, =, or .) at the previous line's end continues a statement across lines."
remediation = "Move the operator or dot to the end of the previous line so it trails (for example svc. on the first line, query() on the next), or keep the construct on one line."
owner = "0200-grammar"
requirement = "Line-joining and semicolon inference"
allocated = "2026-09-03"

[diagnostic.E0103]
severity = "error"
title = "assignment is not an expression"
description = "An assignment appeared where an expression is required: a let/var initializer, a call argument, or any other expression position. Assignment is a statement in We: it produces no value and cannot nest inside expressions, so chained (a = b = c) and conditional-value assignments do not exist."
remediation = "Split into separate statements: assign to each target on its own line; for a call argument pass the value directly instead of assigning inside the call."
owner = "0200-grammar"
requirement = "Statements"
allocated = "2026-09-03"

[diagnostic.E0104]
severity = "error"
title = "chained non-associative operator"
description = "Comparison and equality operators (< <= > >= == !=) are one non-associative precedence level, and the range operator .. is another: a < b < c, x == y == z, and a..b..c are rejected at parse time instead of silently grouping as (a < b) < c."
remediation = "Write the split form with explicit grouping, for example (a < b) && (b < c); each comparison and each range must be a single explicit group."
owner = "0200-grammar"
requirement = "Operator precedence and associativity"
allocated = "2026-09-03"

[diagnostic.E0105]
severity = "error"
title = "unexpected token"
description = "At the current parse position the token fits no ratified production, for example a stray closing bracket, or a construct that fits no ratified form anywhere in the language (an index form list[0] - no production holds it; indexing is by the named access methods of the collections chapter). The message names the token and the productions considered at that position."
remediation = "Check the construct against the ratified surface forms of the grammar chapter; a construct no chapter ratifies - bracketed indexing among them - is re-expressed with ratified forms, for indexing the named access methods."
owner = "0200-grammar"
requirement = "Grammar diagnostics segment"
allocated = "2026-09-03"

[diagnostic.E0201]
severity = "error"
title = "break or continue outside a loop"
description = "break or continue appears in a block that is not inside the body of a ratified loop (while or loop; the iteration chapter adds for). Both are bare forms tied to the innermost enclosing loop; outside one there is nothing to control. Fires under: Break and continue."
remediation = "Remove the stray break/continue, or move it inside a loop body; to exit a block or function use the value/return forms instead of loop-control words."
owner = "0300-control-flow"
requirement = "Break and continue"
allocated = "2026-09-03"

[diagnostic.E0202]
severity = "error"
title = "valueless form in value position"
description = "A form that produces no value is used where a value is required: an if without else, a while or loop statement, or another ratified valueless statement form appears in a let/var initializer, call argument, or other expression position. Recognized valueless forms report this code; tokens that form no ratified production remain chapter 2's unexpected token. Fires under: If and else expressions, While and loop."
remediation = "Supply a value: add an else arm producing a value, or restructure so the valueless form is a statement item and the value comes from an expression, for example an accumulator binding."
owner = "0300-control-flow"
requirement = "If and else expressions"
allocated = "2026-09-03"

[diagnostic.E0203]
severity = "error"
title = "defer body must be a block"
description = "A defer statement's operand is an expression instead of a block, for example defer cleanup(). The block form is the single ratified shape: it keeps multi-statement and ordering needs expressible and gives defer one form. Fires under: Defer."
remediation = "Wrap the calls in a block: defer { cleanup() }; multiple statements and ordering belong inside the block."
owner = "0300-control-flow"
requirement = "Defer"
allocated = "2026-09-03"

[diagnostic.E0204]
severity = "error"
title = "defer placement"
description = "A defer statement is not a direct item of a function body's block, for example inside a nested block expression or another statement. Defer runs at function exit in reverse order; only direct function-body placement keeps that single exit-point semantics. Fires under: Defer."
remediation = "Move the defer to the top level of the enclosing function body, or release the resource through `scope resource` instead of a nested defer."
owner = "0300-control-flow"
requirement = "Defer"
allocated = "2026-09-03"

[diagnostic.E0301]
severity = "error"
title = "match requires at least one arm"
description = "A match expression's brace group holds no arms (`match c { }`). With zero arms no arm can be taken, so the match could never produce a value; the shape is rejected at the form layer rather than deferred to typing. Fires under: Match expression form."
remediation = "Add at least one arm; when only a default outcome is needed, a single wildcard arm `_ => ...` covers all values."
owner = "0400-match"
requirement = "Match expression form"
allocated = "2026-09-03"

[diagnostic.E0302]
severity = "error"
title = "or-pattern branches must bind the same names"
description = "The branches of one or-pattern bind different sets of names (for example `a | b`). All branches must bind exactly the same names so that whichever branch matches, the arm body sees one binding set; the check is syntactic (names only), and the bound names' type agreement is ratified by the types chapter. Fires under: Or-pattern binding consistency."
remediation = "Give every branch the same binding names, or drop the bindings from the or-pattern (for example `200 | 404`); re-express per-branch bindings as separate arms."
owner = "0400-match"
requirement = "Or-pattern binding consistency"
allocated = "2026-09-03"

[diagnostic.E0303]
severity = "error"
title = "pattern names no variant of the scrutinee's type"
description = "A variant pattern's Name is not a declared variant of the scrutinee's sum type (for example `Triangle(r)` against a Shape declaring no Triangle). Variant patterns resolve lexically against the declaration; there is no nearest-match search. Fires under: Pattern set."
remediation = "Spell a declared variant of the scrutinee's type, or match a value of the type that declares the variant; the declaration, not the pattern, fixes the variant set."
owner = "0400-match"
requirement = "Pattern set"
allocated = "2026-09-04"

[diagnostic.E0304]
severity = "error"
title = "variant pattern payload arity mismatch"
description = "A variant pattern's sub-pattern count differs from the declared payload arity (for example `Circle(a, b)` with `Circle(Float64)` declared). Payload elements bind position-wise, so the counts must match exactly. Fires under: Pattern set."
remediation = "Write one sub-pattern per declared payload type; to group payloads, declare the variant with a record payload."
owner = "0400-match"
requirement = "Pattern set"
allocated = "2026-09-04"

[diagnostic.E0305]
severity = "error"
title = "match is not exhaustive"
description = "The unguarded arms' patterns together do not match every value of the scrutinee's type: a variant of the scrutinee's sum type is not covered (the message names it), or the scrutinee's type does not enumerate its values (base types, including Bool, are never exhausted by literals) and no wildcard arm stands. Fires under: Exhaustiveness."
remediation = "Cover the missing variant, or add an unguarded wildcard arm `_ => ...`; literal arms never replace a wildcard on a base type."
owner = "0400-match"
requirement = "Exhaustiveness"
allocated = "2026-09-04"

[diagnostic.E0306]
severity = "error"
title = "guarded match without an unguarded exhaustive fallback"
description = "A match holds guarded arms and its unguarded arms alone are not exhaustive. Guards refine arms but never prove coverage, so an unguarded exhaustive fallback must remain: adding a guard is purely a refinement, never a weakening. Fires under: Exhaustiveness."
remediation = "Keep or add an unguarded arm set that covers every value by itself, typically a wildcard `_ => ...` fallback after the guarded refinements."
owner = "0400-match"
requirement = "Exhaustiveness"
allocated = "2026-09-04"

[diagnostic.E0307]
severity = "error"
title = "unreachable match arm"
description = "An arm can never match: it follows a wildcard arm, or its every value is already covered by earlier arms, as a variant listed twice. Statically decidable dead arms are rejected, not silently kept (v0.8 had no such check; this is a deliberate tightening). Fires under: Exhaustiveness."
remediation = "Delete the unreachable arm, or reorder so the general arm (typically the wildcard) comes last."
owner = "0400-match"
requirement = "Exhaustiveness"
allocated = "2026-09-04"

[diagnostic.E0401]
severity = "error"
title = "return outside a function body"
description = "A return appears where no function-body control flow exists: at the module top level, or inside a defer body (which runs at function exit, where no live control flow remains to exit). The function-body contexts are chapter 6's named fns and chapter 12's closure bodies - a closure's return exits the closure. Fires under: Function bodies, return and defer."
remediation = "Move the return inside the function whose value it carries; for exit-time cleanup use a defer body without control flow, and for module-level logic wrap it in a fn."
owner = "0600-declarations"
requirement = "Function bodies, return and defer"
allocated = "2026-09-03"

[diagnostic.E0402]
severity = "error"
title = "return with a value in a function that declares none"
description = "A function without a declared return type contains `return expr`. The omitted return type states that the function produces no value; a value return contradicts the declaration and is rejected at the form layer. Fires under: Function bodies, return and defer."
remediation = "Either declare the return type (`fn f() -> T`) so the value is the function's product, or drop the expression from the return (bare `return` exits a valueless function legally)."
owner = "0600-declarations"
requirement = "Function bodies, return and defer"
allocated = "2026-09-03"

[diagnostic.E0403]
severity = "error"
title = "var at the top level"
description = "A `var` binding appears as a top-level item. Module-level mutable state does not exist in We: top-level bindings are `let` only, and `var` remains legal only inside blocks. Fires under: Top-level bindings."
remediation = "Declare the top-level binding with `let`; move the mutable state inside a function (a local `var`), or model shared mutable state through the mechanism the concurrency chapter ratifies."
owner = "0600-declarations"
requirement = "Top-level bindings"
allocated = "2026-09-03"

[diagnostic.E0404]
severity = "error"
title = "duplicate name in one module"
description = "Two declarations in one module introduce the same name: an fn name, a top-level let name, a name introduced by an import declaration, a record or newtype name (chapter 8), a sum type name or a variant name (chapter 9), or one name bound twice in a single pattern (chapter 8). One module has one name space shared by all of these; a name is never both a function and a variant. Fires under: Module name space."
remediation = "Rename one of the declarations, or give the import an alias (or drop an existing alias) so the introduced names differ; top-level names must be unique within the module."
owner = "0600-declarations"
requirement = "Module name space"
allocated = "2026-09-03"

[diagnostic.E0405]
severity = "error"
title = "orphan documentation comment"
description = "A `///` documentation unit has no following top-level item before the end of the file. Documentation comments attach to declarations; a unit with nothing to document is rejected rather than silently dropped. Fires under: Documentation comments."
remediation = "Add the declaration the documentation describes, convert the lines to ordinary `//` comments, or remove them."
owner = "0600-declarations"
requirement = "Documentation comments"
allocated = "2026-09-03"

[diagnostic.E0501]
severity = "error"
title = "mixed types"
description = "Two types that must agree do not. Covers operators whose operands differ (mixed widths, signed with unsigned, the two float widths, String/Bytes/Rune across families) and every agreement position: a binding's expression against its annotation, a call argument against its parameter, a return expression against the declared return type, a construction or update field value against its field's declared type (chapter 8), a tuple expression against its element types element-wise (chapter 8), and one if arm against the other (chapter 8). No coercion is ever inserted. Fires under: No implicit conversion."
remediation = "Make the types agree at the source: use a literal suffix (42i32) or an explicit conversion method (toInt64(), toBytes()); the method inventory is the standard library's."
owner = "0700-types"
requirement = "No implicit conversion"
allocated = "2026-09-03"

[diagnostic.E0502]
severity = "error"
title = "integer overflow"
description = "An integer expression overflows its type. A constant-evaluable overflow is a compile error; a runtime overflow is a checked trap that never produces a wrapped value (the trap's construct is named by the error-mechanism chapter). Wrapping is available only through explicit methods; float arithmetic follows IEEE 754 and is not checked. Fires under: Integer overflow semantics."
remediation = "Widen the type (suffix or annotation), restructure the computation, or opt into wrapping explicitly (wrappingAdd() and siblings)."
owner = "0700-types"
requirement = "Integer overflow semantics"
allocated = "2026-09-03"

[diagnostic.E0503]
severity = "error"
title = "condition is not Bool"
description = "A condition position — an if condition, a while condition, or a match guard — is not Bool. Fires under: Condition positions."
remediation = "Make the condition a Bool expression: compare explicitly (n != 0), call a predicate, or apply a conversion method."
owner = "0700-types"
requirement = "Condition positions"
allocated = "2026-09-03"

[diagnostic.E0601]
severity = "error"
title = "value record field is not of the value category or a base type"
description = "A byval record declares a field whose type is neither a base type nor of the value ownership category (for example a gc record field in a byval record). A copy is only honest when everything in it is copyable by value. Fires under: Value records."
remediation = "Make the record gc (drop byval), or store value-category/base data in the field; if reference semantics are needed, the record is not a value record."
owner = "0800-composites"
requirement = "Value records"
allocated = "2026-09-04"

[diagnostic.E0602]
severity = "error"
title = "tuple arity above eight"
description = "A tuple type or expression has more than eight elements. The arity bound forces naming: the longer the tuple, the more it wants to be a record. Fires under: Tuple types and expressions."
remediation = "Declare a record with named fields instead of the long tuple."
owner = "0800-composites"
requirement = "Tuple types and expressions"
allocated = "2026-09-04"

[diagnostic.E0603]
severity = "error"
title = "construction or update head or base is not the record type"
description = "A record construction or update expression's head does not name a record type, or an update expression's base does not have exactly the head's record type. Fires under: Record construction expressions and Update expressions."
remediation = "Name the record type at the head and give an update base of that same type; other forms are not constructible or updatable records."
owner = "0800-composites"
requirement = "Record construction expressions"
allocated = "2026-09-04"

[diagnostic.E0604]
severity = "error"
title = "field set does not match the record"
description = "A construction or update names a field the record does not declare, leaves a declared field out of a full construction, names a field twice, or a member access names an undeclared field. Fires under: Record construction expressions, Update expressions, and Field access."
remediation = "Match the record's declared field set exactly in a construction, name only declared fields in an update, or access a field the record declares."
owner = "0800-composites"
requirement = "Record construction expressions"
allocated = "2026-09-04"

[diagnostic.E0605]
severity = "error"
title = "non-unit value dropped"
description = "A value whose type is not the unit type stands where its value is not consumed: an expression statement, the final item of a function body without a declared return type, the final item of a control form's body, or an unbound match-arm body in statement position. No value drops silently. Fires under: Value discard."
remediation = "Bind the value to use it, chain it onward, declare a return type, or discard it explicitly with `let _ = expr`."
owner = "0800-composites"
requirement = "Value discard"
allocated = "2026-09-04"

[diagnostic.E0606]
severity = "error"
title = "update expression on a resource record"
description = "An update expression's head names a byres record. A resource has identity; copying its fields would duplicate the resource handle. Fires under: Update expressions."
remediation = "Change the resource's fields through the mechanisms of the resource and interfaces chapters; resource records are not updatable with `with &`."
owner = "0800-composites"
requirement = "Update expressions"
allocated = "2026-09-04"

[diagnostic.E0701]
severity = "error"
title = "variant payload arity above eight"
description = "A variant declares more than eight payload types. The arity bound, as for tuples, forces naming: the wider the payload, the more it wants to be a record. Fires under: Sum declarations."
remediation = "Declare the variant with one record payload, which names its fields: `Moved(Point)`."
owner = "0900-sum-types"
requirement = "Sum declarations"
allocated = "2026-09-04"

[diagnostic.E0702]
severity = "error"
title = "value sum payload is not of the value category or a base type"
description = "A byval type declares a variant payload whose type is neither a base type nor of the value ownership category (for example a gc record payload in a value sum). The mirror of value records: a copy is only honest when everything in it is copyable by value. Fires under: Value sums."
remediation = "Drop byval so the sum is gc, or store value-category/base data in the payload; if reference semantics are needed, the sum is not a value sum."
owner = "0900-sum-types"
requirement = "Value sums"
allocated = "2026-09-04"

[diagnostic.E0703]
severity = "error"
title = "Never in a non-return annotation position"
description = "Never annotates a variable binding, field, parameter, variant payload, or tuple element. The bottom type has no values, so it describes only computations that never produce one: it is legal solely as a declared function return type. Fires under: The bottom type."
remediation = "Drop the Never annotation, or move it to a function's return type where a non-producing path is genuinely declared."
owner = "0900-sum-types"
requirement = "The bottom type"
allocated = "2026-09-04"

[diagnostic.E0704]
severity = "error"
title = "payloaded variant constructor used without arguments"
description = "A variant declared with payload appears as a bare name in value position (for example `let g = Circle`). The call form `Circle(...)` constructs; whether the bare name is a first-class constructor value is the function-types chapter's question and is not ratified yet. Fires under: Variant constructors."
remediation = "Construct with the payload (`Circle(1.0)`); first-class constructor values arrive, if at all, with the function-types chapter."
owner = "0900-sum-types"
requirement = "Variant constructors"
allocated = "2026-09-04"

[diagnostic.E0801]
severity = "error"
title = "method declares no receiver"
description = "An interface method signature or an impl-block method definition omits the bare first receiver parameter (`self` or `mut self`), for example `fn describe(d: Describable) -> String`. The receiver is positional and bare: its type is fixed by the impl head and never written. Fires under: Interface declarations, Method receivers."
remediation = "Write the receiver first and bare (`fn describe(self) -> String`); annotated parameters follow it."
owner = "1000-interfaces"
requirement = "Interface declarations"
allocated = "2026-09-04"

[diagnostic.E0802]
severity = "error"
title = "method receiver must be named self"
description = "An impl-block method's bare first parameter is spelled other than `self` (for example `fn upper(me)`). The spelling is enforced the way chapter 1 enforces its case conventions, keeping every method body uniform; `self` remains an ordinary identifier elsewhere. Fires under: Method receivers."
remediation = "Rename the receiver to `self`; it is a binding like any other inside the body."
owner = "1000-interfaces"
requirement = "Method receivers"
allocated = "2026-09-04"

[diagnostic.E0803]
severity = "error"
title = "associated type count above four"
description = "An interface declares five or more associated types. Four is the ceiling: an interface naming more type holes is doing too much for one capability. Fires under: Associated types."
remediation = "Split the interface, or replace later associated types with generic parameters on the interface declaration."
owner = "1000-interfaces"
requirement = "Associated types"
allocated = "2026-09-04"

[diagnostic.E0804]
severity = "error"
title = "associated type declares an upper bound"
description = "An associated-type declaration carries an upper bound (`type Element: Eq`). Bounds belong in where clauses at use sites, not on the hole's declaration. Fires under: Associated types."
remediation = "Drop the bound from the declaration; constrain at impls or calls with `where` clauses."
owner = "1000-interfaces"
requirement = "Associated types"
allocated = "2026-09-04"

[diagnostic.E0805]
severity = "error"
title = "impl misses an associated type binding"
description = "An impl of an interface declaring associated types defines no binding for one of them (`type Element = ...`). The hole must be fixed by every implementation. Fires under: Associated types."
remediation = "Add the binding item (`type Element = Int64`) before the impl's method definitions."
owner = "1000-interfaces"
requirement = "Associated types"
allocated = "2026-09-04"

[diagnostic.E0806]
severity = "error"
title = "associated type binding after a method definition"
description = "An impl places an associated-type binding item below a method definition. Bindings come first so the method signatures can read them. Fires under: Associated types."
remediation = "Move the `type Name = TypeRef` items above every method definition of the impl."
owner = "1000-interfaces"
requirement = "Associated types"
allocated = "2026-09-04"

[diagnostic.E0807]
severity = "error"
title = "impl misses a non-defaulted interface method"
description = "An impl defines no body for an interface method that has no default. An interface's non-defaulted methods are obligations; defaulted ones may be omitted. Fires under: Impl declarations."
remediation = "Define the missing method (the diagnostic names it), or give the interface method a default body through a spec change."
owner = "1000-interfaces"
requirement = "Impl declarations"
allocated = "2026-09-04"

[diagnostic.E0808]
severity = "error"
title = "impl method signature mismatches the interface method"
description = "A defined impl method differs from its interface method in name, its method generic clause (names and arity), receiver mutability, parameter count or types in order, or return type (parameter names may differ). Fires under: Impl declarations."
remediation = "Align the definition with the interface signature; the receiver mutability is part of the contract."
owner = "1000-interfaces"
requirement = "Impl declarations"
allocated = "2026-09-04"

[diagnostic.E0809]
severity = "error"
title = "duplicate impl of one interface for one type"
description = "One interface is implemented twice for one head type, counting substitutions: a concrete impl overlapping a generic impl's instantiations is equally a duplicate. Fires under: Impl declarations."
remediation = "Keep one impl; widen a generic impl instead of adding overlapping concrete ones."
owner = "1000-interfaces"
requirement = "Impl declarations"
allocated = "2026-09-04"

[diagnostic.E0810]
severity = "error"
title = "orphan impl"
description = "An impl is written in a module that declares neither the interface nor the head type (for an inherent impl: a module that does not declare the head). Foreign interface for foreign type is the orphan; extension of foreign types by inherent methods does not exist. Fires under: Impl declarations, Inherent impls."
remediation = "Move the impl into a module declaring the interface or the type, or declare a local interface and implement it for the foreign type."
owner = "1000-interfaces"
requirement = "Impl declarations"
allocated = "2026-09-04"

[diagnostic.E0811]
severity = "error"
title = "impl head is not a nominal type"
description = "The head of an impl is a tuple, a base type, or a bare generic parameter instead of a record, newtype, or sum name or a generic application of one. This discharges chapter 8's obligation: tuples implement no interfaces. Fires under: Impl declarations."
remediation = "Implement for a nominal type; wrap tuple data in a record or newtype first."
owner = "1000-interfaces"
requirement = "Impl declarations"
allocated = "2026-09-04"

[diagnostic.E0812]
severity = "error"
title = "mut self receiver on a value-category type"
description = "An impl on a byval record or sum declares a `mut self` receiver. Value semantics copies; a value copy has nothing to mutate in place. Fires under: Method receivers."
remediation = "Drop `mut` (produce a new value instead), or change the declaration's category so in-place mutation is honest."
owner = "1000-interfaces"
requirement = "Method receivers"
allocated = "2026-09-04"

[diagnostic.E0813]
severity = "error"
title = "field write outside a mut self method body"
description = "`self.field = expr` appears inside a plain `self` method, a plain fn, or at the top level. The receiver field assignment is the language's one field-assignment form and lives only inside mut-self bodies. Fires under: Receiver field assignment."
remediation = "Declare the receiver `mut self`, or produce a new value with the update expression."
owner = "1000-interfaces"
requirement = "Receiver field assignment"
allocated = "2026-09-04"

[diagnostic.E0814]
severity = "error"
title = "member name collision on one type"
description = "One type would carry two members of one name: a field against a method, an inherent method against an interface method, methods of two interfaces, or an inherent method against an inherited default. One name, one meaning. Fires under: Member name resolution, Default methods."
remediation = "Rename one member, or define the method in the for-form impl instead of relying on an inherent one or a default."
owner = "1000-interfaces"
requirement = "Member name resolution"
allocated = "2026-09-04"

[diagnostic.E0815]
severity = "error"
title = "method call outside the receiver's method set"
description = "A member call on a receiver whose static position is an interface - a `Dyn<I>` value, or `self` inside a default method body - names a method outside that interface's set. The erased type's own members are not reachable there. Fires under: Member name resolution, Dyn values."
remediation = "Call interface methods only through the box, or rebind the concrete value and call its own member."
owner = "1000-interfaces"
requirement = "Member name resolution"
allocated = "2026-09-04"

[diagnostic.E0816]
severity = "error"
title = "no such member on the receiver's type"
description = "Member access names neither a field, an inherent method, an interface method, nor a generated derive method of the receiver's type. Grounds chapter 8's record side: unknown names are one rule, one code. Fires under: Member name resolution, Receiver field assignment."
remediation = "Fix the name, or declare the member; unknown-field access on records lands here too."
owner = "1000-interfaces"
requirement = "Member name resolution"
allocated = "2026-09-04"

[diagnostic.E0817]
severity = "error"
title = "method call on an unconstrained generic parameter"
description = "A method is called on a value of an unconstrained generic parameter type. An unconstrained parameter is opaque: it has no members. Fires under: Member name resolution, Generic parameter declarations."
remediation = "Add a where bound naming an interface (`where T: Describable`); its method set becomes available inside."
owner = "1000-interfaces"
requirement = "Member name resolution"
allocated = "2026-09-04"

[diagnostic.E0818]
severity = "error"
title = "Dyn construction from a non-implementing type"
description = "`Dyn<Interface>(expr)` is constructed with an expression whose type does not implement the interface. The box carries an implementing value only. Fires under: Dyn values."
remediation = "Box a value of an implementing type, or implement the interface for the type first."
owner = "1000-interfaces"
requirement = "Dyn values"
allocated = "2026-09-04"

[diagnostic.E0819]
severity = "error"
title = "Dyn of an interface with associated types"
description = "`Dyn<Interface>` names an interface that declares associated types. The erased value could not honor the binding: dispatch would not know the type. Fires under: Associated types, Dyn values."
remediation = "Use the interface generically (`where T: Stream`) instead of erasing it, or drop the associated types."
owner = "1000-interfaces"
requirement = "Dyn values"
allocated = "2026-09-04"

[diagnostic.E0820]
severity = "error"
title = "Dyn argument is not an interface type"
description = "The `<...>` argument of a `Dyn` form names a base type, a record, a sum, or a generic parameter instead of a declared interface. Fires under: Dyn values."
remediation = "Erase an interface: `Dyn<Describable>`; other types occupy type slots directly."
owner = "1000-interfaces"
requirement = "Dyn values"
allocated = "2026-09-04"

[diagnostic.E0821]
severity = "error"
title = "interface name used as a value type"
description = "A bare interface name appears in a value type slot (`let d: Describable`, a parameter `x: Describable`). An interface is not a value type; it occupies type slots only as the erased box. Fires under: Dyn values."
remediation = "Write `Dyn<Describable>` for erased values, or a bounded generic parameter for parametric ones."
owner = "1000-interfaces"
requirement = "Dyn values"
allocated = "2026-09-04"

[diagnostic.E0822]
severity = "error"
title = "manual impl of a builtin derive target"
description = "A manual `impl Eq for ...` (or Hash, Show) appears. The derive targets are builtin: their methods are generated by the derives clause, never hand-written - this keeps composite equality one story with the base-types-only `==`. Fires under: Derives."
remediation = "Write the clause instead: `record Point { ... } derives Eq`; hand-written logic belongs in your own interface."
owner = "1000-interfaces"
requirement = "Derives"
allocated = "2026-09-04"

[diagnostic.E0823]
severity = "error"
title = "derive field requirement unmet"
description = "An `Eq` or `Hash` derive names a type whose fields, underlying type, or payload types do not carry the capability (base types carry it; composites carry it through their own derives). On generic declarations the check runs at each instantiation. Fires under: Derives, Record declarations of chapter 8 as amended, Sum declarations as amended."
remediation = "Derive the requirement on the field type too, or drop the target; `Show` asks nothing."
owner = "1000-interfaces"
requirement = "Derives"
allocated = "2026-09-04"

[diagnostic.E0824]
severity = "error"
title = "unknown or duplicate derive target"
description = "A derives clause names a target outside the closed set `Eq`, `Hash`, `Show`, or names one twice. Fires under: Derives."
remediation = "Use targets from the closed set, each once; Encodable/Decodable arrive with the JSON change, Shareable with the concurrency chapter."
owner = "1000-interfaces"
requirement = "Derives"
allocated = "2026-09-04"

[diagnostic.E0825]
severity = "error"
title = "generic parameter count above eight"
description = "A generic parameter clause declares nine or more parameters - the arity mirror of the composite chapters' eights. Fires under: Generic parameter declarations."
remediation = "Reduce the clause; a type or function needing more parameters is doing too much."
owner = "1000-interfaces"
requirement = "Generic parameter declarations"
allocated = "2026-09-04"

[diagnostic.E0826]
severity = "error"
title = "generic parameter shadows an enclosing parameter"
description = "A generic clause redeclares a name of an enclosing clause. Method generic clauses are the ratified nesting surface - a method clause inside its declaration's clause; nested declarations are not ratified. The rule binds wherever a clause nests. Fires under: Generic parameter declarations."
remediation = "Rename the inner parameter; shadowing across clauses is rejected even where nesting exists."
owner = "1000-interfaces"
requirement = "Generic parameter declarations"
allocated = "2026-09-04"

[diagnostic.E0827]
severity = "error"
title = "generic call does not determine its type arguments"
description = "A generic call or construction leaves a type argument undetermined: the arguments' types do not mention it and no explicit form is written. Expected-type inference does not exist - determination is single-direction, from the call's own text. Fires under: Generic type references and inference."
remediation = "Write the explicit form: `empty<Int64>()`, `Pair<Int64, String> { ... }`."
owner = "1000-interfaces"
requirement = "Generic type references and inference"
allocated = "2026-09-04"

[diagnostic.E0828]
severity = "error"
title = "type argument arity mismatch"
description = "An explicit type-argument list or a generic application's arguments differ in count from the declaration's clause. Fires under: Generic type references and inference."
remediation = "Match the declaration's arity, or fix the declaration's clause."
owner = "1000-interfaces"
requirement = "Generic type references and inference"
allocated = "2026-09-04"

[diagnostic.E0829]
severity = "error"
title = "where bound is not a declared interface"
description = "A where-clause bound names a record, sum, base type, or generic parameter instead of a declared interface. Bounds grant interface method sets; only interfaces have them. Fires under: Where clauses."
remediation = "Bound by an interface, or express the constraint differently (associated-type equalities are separate constraints)."
owner = "1000-interfaces"
requirement = "Where clauses"
allocated = "2026-09-04"

[diagnostic.E0830]
severity = "error"
title = "type argument does not satisfy a where bound"
description = "At a call or instantiation, a type argument does not implement a where bound of the declaration. Bounds are checked at every use. Fires under: Where clauses, Generic type references and inference."
remediation = "Pass an implementing type, or implement the interface for it, or widen the declaration's constraints."
owner = "1000-interfaces"
requirement = "Where clauses"
allocated = "2026-09-04"

[diagnostic.E0831]
severity = "error"
title = "associated-type equality right side is not concrete"
description = "A where-clause equality `T.Assoc == X` has a right side that is not a concrete type (a base type, a nominal type, or a generic application of them) - for example `== U` or `== T`. Fires under: Where clauses."
remediation = "Write a concrete type on the right side; parameterized equalities are not ratified."
owner = "1000-interfaces"
requirement = "Where clauses"
allocated = "2026-09-04"

[diagnostic.E0901]
severity = "error"
title = "for-in expression does not implement Iterable"
description = "The for statement's iterable expression has a type that implements no Iterable<T>: a plain integer, a record without an impl, a Bytes value, or a bare Iterator<T> (an iterator alone is not a for iterable). Fires under: The for-loop protocol."
remediation = "Iterate a type implementing Iterable - a collection, a String, a Range, or your own type's impl - and consume a bare iterator with explicit next() calls instead."
owner = "1100-iterables"
requirement = "The for-loop protocol"
allocated = "2026-09-04"

[diagnostic.E0902]
severity = "error"
title = "range operand is not an integer type"
description = "A range operand (`start..end`) has a type other than chapter 7's eight integer types - a float, a rune, or any other type. Fires under: The Range type."
remediation = "Give both bounds one integer type; express float spans as explicit loops over an integer index or a step method."
owner = "1100-iterables"
requirement = "The Range type"
allocated = "2026-09-04"

[diagnostic.E0903]
severity = "error"
title = "impl of Iterable for a resource-category type"
description = "A byres (resource) record is the head of an impl of Iterable: an iterator holds a live view of its collection across the loop's executions, outliving the single deterministic release point a resource's discipline depends on. Fires under: Iterable implementer obligations."
remediation = "Materialize the contents first - one explicit read into a collection - then iterate the collection."
owner = "1100-iterables"
requirement = "Iterable implementer obligations"
allocated = "2026-09-04"

[diagnostic.E0904]
severity = "error"
title = "impl binds Iter to a non-iterator type"
description = "An impl of Iterable<T> binds its associated type Iter to a type that does not implement Iterator<T> for the same element type, for example `type Iter = Int64`. The handle contract is part of the interface. Fires under: The Iterable interface."
remediation = "Bind Iter to a type implementing Iterator<T> for the same T - a cursor record of your own or a standard-library iterator type."
owner = "1100-iterables"
requirement = "The Iterable interface"
allocated = "2026-09-04"

[diagnostic.E1001]
severity = "error"
title = "bare-parameter closure without an expected function type"
description = "A short closure with bare parameters sits where no explicit function type is expected - no binding annotation, no parameter's declared function type, no declared return position. Fires under: The short closure form."
remediation = "Annotate the parameters - |x: Int64| x + 1 - or give the binding a function-type annotation so the parameters take their types from it."
owner = "1200-fn-types"
requirement = "The short closure form"
allocated = "2026-09-04"

[diagnostic.E1002]
severity = "error"
title = "resource binding captured by a closure"
description = "A closure body reads a byres (resource) binding of the enclosing scope: a closure outlives its creation site by construction, and a handle escaping the single deterministic release point a resource's discipline depends on is not honest. Fires under: Capture discipline."
remediation = "Materialize the resource's contents first - one explicit read into a value - and capture the materialized value."
owner = "1200-fn-types"
requirement = "Capture discipline"
allocated = "2026-09-04"

[diagnostic.E1003]
severity = "error"
title = "assignment to a captured value-category binding"
description = "A closure body assigns to a captured binding of a value-category type or a base type: such captures are copies fixed at closure creation, and the snapshot is frozen. Fires under: Capture discipline."
remediation = "Carry the intermediate in a local binding of the closure body, or hold the state in a gc-category cell and capture that."
owner = "1200-fn-types"
requirement = "Capture discipline"
allocated = "2026-09-04"

[diagnostic.E1004]
severity = "error"
title = "generic function name in value position"
description = "A fn carrying a generic clause is used by its bare name in value position: the generic clause makes the name a family, not one function, and no single function type names it; no instantiation syntax is ratified. Fires under: Function values."
remediation = "Call the generic fn - pairUp(1, 2) - or write a closure over it at the types wanted."
owner = "1200-fn-types"
requirement = "Function values"
allocated = "2026-09-04"

[diagnostic.E1101]
severity = "error"
title = "resource record must implement Releasable"
description = "A byres record is declared with no impl of Releasable in its declaring module. The resource category carries the release contract as a declaration-completeness obligation, checked where the record is declared; chapter 10's orphan rule holds the impl in the record's own module. Fires under: The Releasable interface."
remediation = "Add `impl Releasable for Name { fn release(mut self) { ... } }` in the record's own module, or declare the type as a gc or value record if it owns no resource."
owner = "1300-resources"
requirement = "The Releasable interface"
allocated = "2026-09-04"

[diagnostic.E1102]
severity = "error"
title = "Releasable implemented by a non-resource type"
description = "An impl of Releasable whose head type is not a byres record - a gc record, a value record, a sum, a newtype, a base type, or a generic parameter. The resource category is the release contract's only implementer; a non-resource carry would promise release discipline to a shared-handle value. Fires under: The Releasable interface."
remediation = "Remove the impl, or declare the head type as a byres record so it owns its release."
owner = "1300-resources"
requirement = "The Releasable interface"
allocated = "2026-09-04"

[diagnostic.E1103]
severity = "error"
title = "scope resource head does not implement Releasable"
description = "A scope resource binding's head expression has a type that does not implement Releasable. Under the declaration-completeness obligation the implementers are exactly the byres records, so every non-resource head is rejected; the scope-exit machinery can only release what carries the contract. Fires under: The scope resource statement."
remediation = "Bind the expression with `let` instead, or make the head's type a byres record implementing Releasable."
owner = "1300-resources"
requirement = "The scope resource statement"
allocated = "2026-09-04"

[diagnostic.E1104]
severity = "error"
title = "resource binding outside its release discipline"
description = "A binding of a resource type escapes the linear release discipline: a control path ends with no transfer (scope-resource head move, return, or argument pass to a parameter declaring the type); a binding is used after its transfer point; a resource is bound at the module top level, where no channel exists; or user code calls `release` directly on a resource-typed receiver - release has one trigger, the scope-exit machinery, and early release is an early scope exit. Fires under: The release discipline and One release trigger."
remediation = "Transfer the binding on every path - `scope resource(x = f)`, `return f`, or pass it to a fn whose parameter declares the type; for early release, exit the scope with return/break/continue instead of calling release."
owner = "1300-resources"
requirement = "The release discipline"
allocated = "2026-09-04"

[diagnostic.E1105]
severity = "error"
title = "resource binding rebound"
description = "A resource binding gains a second handle: `let g = f` or `var g = f` with `f` resource-typed, an assignment with either side resource-typed, or a `var` declaration of a resource type. A resource binding is the one handle; the one sanctioned move is a transfer, which hands over and kills the source. Fires under: No aliasing of resource bindings."
remediation = "Transfer instead of aliasing - `scope resource(x = f)` takes over and the source dies; or keep the single binding and pass it along."
owner = "1300-resources"
requirement = "No aliasing of resource bindings"
allocated = "2026-09-04"

[diagnostic.E1106]
severity = "error"
title = "resource type in a composite position"
description = "A resource type appears outside binding positions: a tuple element, a gc record's field, a sum payload, a newtype's underlying type, a generic argument at any instantiation (Box<FileHandle>, id<FileHandle> alike), or the box route - Dyn<Releasable> in a type position or Dyn<Releasable>(r) construction. A handle with more than one path to it outlives the single deterministic release point the discipline depends on. Fires under: Resources keep to binding positions."
remediation = "Keep the resource in its own binding and pass it by parameter or return; carry plain data in the composite instead, or a key the receiver can reopen the resource from."
owner = "1300-resources"
requirement = "Resources keep to binding positions"
allocated = "2026-09-04"

[diagnostic.E1201]
severity = "error"
title = "operand of ? is not a Result type"
description = "The propagation postfix is applied to an operand that is not of a Result type, Option included. Only Result values propagate; an Option unwraps by match. Fires under: The propagation operator."
remediation = "Match the value to take its payload, or call a function that returns Result before propagating."
owner = "1400-errors"
requirement = "The propagation operator"
allocated = "2026-09-04"

[diagnostic.E1202]
severity = "error"
title = "? outside a function returning Result"
description = "The propagation postfix appears with no live propagation context: the innermost enclosing function or closure returns a non-Result type, the position is a defer body (which runs at exit and has no return to propagate to), or the position is the module top level. Fires under: The propagation operator."
remediation = "Move the propagation into a function or closure whose return type is Result, or handle the value by match at this position."
owner = "1400-errors"
requirement = "The propagation operator"
allocated = "2026-09-04"

[diagnostic.E1203]
severity = "error"
title = "? error type disagrees with the declared error type"
description = "The operand's error type E_src is not the same named type as the propagation context's declared error type E_dst. There is no implicit wrapping or lifting; error conversion is explicit. Fires under: The propagation operator."
remediation = "Convert explicitly - a match that wraps the error into the declared type, or a standard-library combinator when its change ratifies one."
owner = "1400-errors"
requirement = "The propagation operator"
allocated = "2026-09-04"

[diagnostic.E1204]
severity = "error"
title = "Result error type is not a named sum type"
description = "The error parameter of Result is not a named sum type: a base type (String included), a record, an interface, a Dyn box, or a generic parameter appears in the error position. The constraint is exhaustiveness: a named sum's variant set is closed, so a match on a Result covers Ok and Err with all of E's variants visible. Fires under: The Result type."
remediation = "Declare a named sum type carrying the failure variants and use it as the error parameter."
owner = "1400-errors"
requirement = "The Result type"
allocated = "2026-09-04"

[diagnostic.E1301]
severity = "error"
title = "circular module dependency"
description = "The import graph holds a cycle: module A imports module B directly or transitively while B imports A. There are no forward declarations; a cycle has no initialization order. Fires under: Module paths and file resolution."
remediation = "Extract the code both modules need into a third module and import it from each."
owner = "1500-modules"
requirement = "Module paths and file resolution"
allocated = "2026-09-04"

[diagnostic.E1302]
severity = "error"
title = "module not found"
description = "An import's dotted path resolves to no module: the expected file is absent under the source root, the std segment is compiler-provided and the path names no standard-library module, and no dependency-cache entry answers. The message names the expected file path under the mapping. Fires under: Module paths and file resolution."
remediation = "Create the file at the expected path, fix the path spelling, or add the dependency to the cache."
owner = "1500-modules"
requirement = "Module paths and file resolution"
allocated = "2026-09-04"

[diagnostic.E1303]
severity = "error"
title = "cross-module use of a module-local item"
description = "A module reaches an item of another module that is declared without pub - in value position, type position, or as a variant constructor. Cross-module reach is exactly the qualified form name.item through an import, and only for pub items; an item declared but not pub is this code's, while an item the module does not declare is E1304's. Fires under: Cross-module visibility."
remediation = "Prefix the declaration with pub if it is meant to be public, or use a pub item of the module instead."
owner = "1500-modules"
requirement = "Cross-module visibility"
allocated = "2026-09-04"

[diagnostic.E1304]
severity = "error"
title = "unresolved name"
description = "A name is held by no scope: a bare identifier naming no block-local binding, module declaration, import name, or prelude name; a qualified form whose qualifier is not an import name; or an item the imported module does not declare. Type positions resolve by the same rules. Fires under: Name resolution."
remediation = "Fix the spelling, declare the name, import the module, or qualify through an existing import name."
owner = "1500-modules"
requirement = "Name resolution"
allocated = "2026-09-04"

[diagnostic.E1305]
severity = "error"
title = "main function signature violation"
description = "The root module src/main.we declares no fn main, declares main without pub, or declares a main whose signature is not pub fn main() -> Result<(), E> with E a named sum type. The convention binds the root module alone; elsewhere main is an ordinary fn name. A well-shaped main whose error position violates the named-sum constraint is E1204's, not this code's. Fires under: The main convention."
remediation = "Declare exactly one pub fn main() -> Result<(), E> in src/main.we with E a named sum type."
owner = "1500-modules"
requirement = "The main convention"
allocated = "2026-09-04"

[diagnostic.E1401]
severity = "error"
title = "undeclared effect at a call"
description = "A function body performs a call whose effect set is not a subset of the function's declared effect set: the callee declares an effect the caller does not, a defer body's calls count toward the enclosing function, or a call through a parameter typed with an effect segment performs what that type declares. Omitted segment means pure."
remediation = "Add the missing tag to the enclosing declaration's effect segment, or call a pure function instead."
owner = "1600-effects"
requirement = "The effect segment"
allocated = "2026-09-04"

[diagnostic.E1402]
severity = "error"
title = "function value effect set does not match the expected type's"
description = "At a type-agreement position holding a function value - binding against an annotation, argument against parameter, return against the declared type - the value's effect set is not a subset of the expected function type's set. An effectful value in a pure slot is the usual form; a purer value in an effect-expecting slot is always legal."
remediation = "Widen the expected type's effect segment to cover the value's set, or supply a value that performs less."
owner = "1600-effects"
requirement = "The effect segment in function types"
allocated = "2026-09-04"

[diagnostic.E1403]
severity = "error"
title = "effect name conflicts with a built-in effect"
description = "A custom effect declaration takes the name io, net, or time. Built-in tags are language-level names, not module items, so no module name space collision fires - this code alone refuses the declaration."
remediation = "Choose a camelCase name that is not one of the built-in tags."
owner = "1600-effects"
requirement = "Effect declarations and the built-in tags"
allocated = "2026-09-04"

[diagnostic.E1404]
severity = "error"
title = "impl method effect set disagrees with the interface"
description = "An impl method's effect set does not equal the interface method's declared set exactly: a tag missing, an extra tag, or a defaulted method's override dropping the interface's segment. The sets must match in both directions - the caller sees the interface's set, whichever implementation runs."
remediation = "Copy the interface method's effect segment into the impl method's signature exactly, in both directions."
owner = "1600-effects"
requirement = "Effects in interfaces and impls"
allocated = "2026-09-04"

[diagnostic.E1405]
severity = "error"
title = "effectful call in a top-level initializer"
description = "A top-level let initializer calls an effectful function. Initializers are the one ratified position that evaluates outside any function signature; they must be pure, keeping process start free of environmental reads and writes."
remediation = "Move the work into main, or initialize from a pure computation over constants."
owner = "1600-effects"
requirement = "Effect checking at module initialization"
allocated = "2026-09-04"

[diagnostic.E1501]
severity = "error"
title = "empty list literal has no expected type"
description = "An empty list literal `[]` appears at a position with no expected type: an unannotated binding, or any slot whose type no declaration fixes. A non-empty literal's element type comes from its elements; an empty one has nothing to infer from, and the language infers nothing (chapter 0, Principle 1) - the expected type is the element type's only source. Fires under: List literals."
remediation = "Write the annotation (`let xs: List<String> = []`), place the literal where a parameter or declared return fixes the type, or start the list with elements."
owner = "1700-collections"
requirement = "List literals"
allocated = "2026-09-04"

[diagnostic.E1601]
severity = "error"
title = "task block without an effect segment"
description = "A task block appears with no effect segment between the task keyword and its block. A task runs in its own task, outside every enclosing function extent, so its body's calls have no enclosing declaration to answer: the block declares its own effects, and omission leaves the body's calls answerable to nothing."
remediation = "Write the segment of the chapter 16 spelling: task effect tag1 tag2 ... followed by the block."
