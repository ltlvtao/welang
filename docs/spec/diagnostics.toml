allocated = "2026-09-04"

[diagnostic.E1610]
severity = "error"
title = "select arms disagree in type"
description = "The bodies of a select expression's cases disagree in type. The select expression's value is the taken case's body value, so every arm must agree on one type, the unit type included - the same agreement match arms follow."
