owner = "1800-concurrency"
requirement = "CancelSignal and currentCancelSignal"
allocated = "2026-09-04"

[diagnostic.E1609]
severity = "error"
title = "select source is not a wait source"
description = "A select case's source position holds an expression outside the closed wait-source set - Channel.receive(), ReceiveOnly.receive(), TaskHandle.await(), CancelSignal.awaitCancelled() and nothing else."
