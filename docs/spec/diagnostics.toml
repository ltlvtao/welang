[diagnostic.E1902]
severity = "error"
title = "unmocked effect executed during exploration"
description = "An exploration run executed a call of a custom effect tag with no mock on its path. The real call's behavior breaks the probe's premise of reproducible interleavings - the same condition W1910 advises about in an ordinary run is an error under exploration. Fires under: Exploration."
remediation = "Mock the custom-effect function the explored path calls, so the run stays on the virtual clock's determinism."
owner = "2100-toolchain"
requirement = "Exploration"
allocated = "2026-09-04"

[diagnostic.E1903]
severity = "error"
title = "invalid toolchain configuration value"
description = "A value in the project manifest's configuration tables falls outside its legal domain: a [vet] entry not one of warning, error, ignore; a type not executable or library; an explore-iterations that is not a positive integer. The message names the key, the legal values, and what was found. Fires under: The project manifest, Advisory diagnostics and we vet."
remediation = "Set the named key to one of the legal values the diagnostic lists."
owner = "2100-toolchain"
requirement = "The project manifest"
allocated = "2026-09-04"

[diagnostic.E1904]
severity = "error"
title = "invalid project name"
description = "A project name outside chapter 1's naming convention - we new's argument, or the manifest's name field. One rule, two entry points. Fires under: The we command surface, The project manifest."
remediation = "Use lowercase letters, digits, and hyphens per chapter 1's naming convention."
owner = "2100-toolchain"
requirement = "The we command surface"
allocated = "2026-09-04"

[diagnostic.E1905]
severity = "error"
title = "project manifest missing or incomplete"
description = "A project invocation - a directory-path command - found no we.toml, or a manifest missing the name, version, or type key. The message names the missing key. Fires under: The project manifest."
remediation = "Create we.toml with the name, version, and type keys, or run we new to write the skeleton."
owner = "2100-toolchain"
requirement = "The project manifest"
allocated = "2026-09-04"

[diagnostic.E1906]
severity = "error"
title = "unresolved native symbol"
description = "At build time a name declared in a foreign block bound to no discoverable native symbol of the platform C ABI. The message names the declaration and the symbol sought. we check does not link, so this code cannot fire under it. Fires under: Linkage of foreign declarations."
remediation = "Provide the native library or symbol the declaration names, or correct the declaration to the symbol that exists."
owner = "2100-toolchain"
requirement = "Linkage of foreign declarations"
allocated = "2026-09-04"

[diagnostic.E1907]
severity = "error"
title = "command path not found"
description = "A [path] argument of a we subcommand names no file or directory. Fires under: The we command surface."
remediation = "Pass a project directory, a .we file, or nothing (the working directory)."
owner = "2100-toolchain"
requirement = "The we command surface"
allocated = "2026-09-04"

[diagnostic.W1910]
severity = "warning"
title = "unmocked custom effect in a test"
description = "A test's code path calls a function of a custom effect tag with no mock on that path - the call is real, chapter 20 says so, and the finding advises the mock. Advisory: never stops the pipeline unless promoted to error by the manifest's [vet] table. Fires under: Advisory diagnostics and we vet."
remediation = "Mock the custom-effect function on the test's path, or accept the real call deliberately."
owner = "2100-toolchain"
requirement = "Advisory diagnostics and we vet"
allocated = "2026-09-04"

[diagnostic.W1911]
severity = "warning"
title = "possible indirect nested access to one shared value"
description = "A function called within a shared value's callback body may access the same binding again - chapter 18's E1613 sees direct calls only, and this heuristic looks one call through. Conservative by design, false-positive-tolerant: a survey, never a verification. Advisory unless promoted. Fires under: Advisory diagnostics and we vet."
remediation = "Review the called function; if it touches the same shared value, restructure so the callback completes before the nested access."
owner = "2100-toolchain"
requirement = "Advisory diagnostics and we vet"
allocated = "2026-09-04"

[diagnostic.W1912]
severity = "warning"
title = "function may block on a wait"
description = "A function body directly calls one of the five operations whose waits block - Semaphore.acquire, Cond.wait, Channel.send, Channel.receive, TaskHandle.await, per chapter 18's semantics. Information chapter 16 deliberately keeps out of the effect system; the informational note is informational in character. Advisory unless promoted. Fires under: Advisory diagnostics and we vet."
remediation = "No change required; the note informs lock-wait chain analysis. Wrap with scope timeout if the wait must be bounded."
owner = "2100-toolchain"
requirement = "Advisory diagnostics and we vet"
allocated = "2026-09-04"

[diagnostic.E2001]
severity = "error"
title = "unknown dependency"
description = "A declared dependency's name answers to no package in any source: the declaration is well-formed and the name simply resolves to nothing. The message names the package sought. Fires under: Resolution by the maximum of floors."
remediation = "Check the spelling of the dependency name, or declare a package that exists."
owner = "2200-dependencies"
requirement = "Resolution by the maximum of floors"
allocated = "2026-09-04"

[diagnostic.E2002]
severity = "error"
title = "unsatisfiable dependency constraint"
description = "The maximum-of-floors pick for a package violates a constraint's ceiling in the graph, or the demanded version exists in no source. The message names the package, the pick, and the violated constraint with its dependent chain. Fires under: Resolution by the maximum of floors."
remediation = "Loosen or align the conflicting constraint - typically raise or drop an exact pin - so the graph's floors and ceilings admit one common version."
owner = "2200-dependencies"
requirement = "Resolution by the maximum of floors"
allocated = "2026-09-04"

[diagnostic.E2003]
severity = "error"
title = "invalid version constraint"
description = "A dependency's constraint string falls outside the four forms - caret, tilde, greater-or-equal, exact - or its operand is not a well-formed version. The message names the key and the grammar. Fires under: Semantic versions and constraint meanings."
remediation = "Write the constraint in one of the four forms with a three-part version operand, such as ^1.4.0."
owner = "2200-dependencies"
requirement = "Semantic versions and constraint meanings"
allocated = "2026-09-04"

[diagnostic.E2004]
severity = "error"
title = "invalid version value"
description = "A version value is not a well-formed semantic version - three dot-separated non-negative integers without leading zeros. The manifest's own version field is the usual site; v0.8's E0151 renumbered and widened from the project's own version to any version value. Fires under: Dependency declarations."
remediation = "Write the version as three integers, major.minor.patch, without leading zeros."
owner = "2200-dependencies"
requirement = "Dependency declarations"
allocated = "2026-09-04"

[diagnostic.E2005]
severity = "error"
title = "lockfile integrity mismatch"
description = "Content acquired into the dependency cache does not hash to its we.lock entry's digest: the content is not what was locked, and the build refuses it. The message names the package. The digest algorithm itself is the toolchain's mechanism. Fires under: The lockfile."
remediation = "Reacquire the package (clear the corrupted cache entry) or regenerate the lock if the dependency was legitimately replaced."
owner = "2200-dependencies"
requirement = "The lockfile"
allocated = "2026-09-04"

[diagnostic.E2006]
severity = "error"
title = "invalid dependency name"
description = "A [dependencies] key is not a package name under chapter 1's naming convention - lowercase letters, digits, and hyphens - or is the reserved name std, which names the built-in standard library and is never a dependency. The message names the key and the convention. Fires under: Dependency declarations."
remediation = "Use a lowercase-hyphenated package name; import the standard library directly, for std needs no declaration."
owner = "2200-dependencies"
requirement = "Dependency declarations"
allocated = "2026-09-04"
