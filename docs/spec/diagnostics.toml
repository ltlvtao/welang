requirement = "Task blocks"
allocated = "2026-09-04"

[diagnostic.E1602]
severity = "error"
title = "task block captures unsynchronized gc state"
description = "A task block captures a binding that holds live gc state with no synchronization discipline: a gc-category binding not of a synchronized type (Mutex, RwLock, Atomic, AtomicRef, Cond, Semaphore, Channel, SendOnly, ReceiveOnly, TaskHandle, CancelSignal), or a value-category shape - a record or tuple - whose parts hold gc state the Shareable set excludes, a List field among them. Unsynchronized gc state crossing a task boundary is a data race whatever shape carries it."
remediation = "Carry the state in a synchronized type (store the list in a Mutex, send it through a Channel), or capture only Shareable data and let the task receive the rest."
owner = "1800-concurrency"
requirement = "Task capture discipline"
allocated = "2026-09-04"

[diagnostic.E1603]
severity = "error"
title = "task block captures a var binding"
description = "A task block captures a var binding, of whatever type. Mutability and concurrency together are a race by definition: two writers, no discipline between them."
remediation = "Carry the mutable state in a shared-state type and reach it through its methods, or copy the value into an immutable binding before the task block."
owner = "1800-concurrency"
requirement = "Task capture discipline"
allocated = "2026-09-04"

[diagnostic.E1604]
severity = "error"
title = "task block captures a resource whose type declares mut self methods"
description = "A task block captures a resource-category binding whose type declares a mut self method besides release. Every such method is a read-modify-write another task can race on; the capture rule admits resource types whose methods are all reads."
remediation = "Restrict the type to self methods, keep the task out, or materialize the contents and capture those instead."
owner = "1800-concurrency"
requirement = "Task capture discipline"
allocated = "2026-09-04"

[diagnostic.E1605]
severity = "error"
title = "task block captures a generic-parameter binding without a Shareable bound"
description = "A generic declaration's task block captures a binding whose type mentions a generic parameter carrying no Shareable bound. Without the bound, the parameter admits unsynchronized gc state; with it, the closed Shareable set guarantees it does not."
remediation = "Declare the parameter with a Shareable bound, or keep the capture to concrete Shareable types."
owner = "1800-concurrency"
requirement = "Task capture discipline"
allocated = "2026-09-04"

[diagnostic.E1606]
severity = "error"
title = "Shareable cannot be manually implemented"
description = "A manual impl attempts to implement the Shareable marker. The marker is computed from a declaration's own shape - field types, payload types, category - and the compiler attaches it; no impl production expresses it."
